[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "18"

# Admin redirects - must be before the 404 redirect
[[redirects]]
  from = "/admin"
  to = "https://astro-blog-boost.preview.emergentagent.com/admin/login"
  status = 302
  force = true

[[redirects]]
  from = "/admin/*"
  to = "https://astro-blog-boost.preview.emergentagent.com/admin/:splat"
  status = 302
  force = true

# Blog post pages - serve the post template, let client-side JS handle the content
[[redirects]]
  from = "/blog/:slug"
  to = "/blog/post/index.html"
  status = 200

# Redirects for SPA-like behavior (optional)
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Headers for better caching and security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400"
